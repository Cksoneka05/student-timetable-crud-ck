<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student Timetable & Goals</title><link rel="stylesheet" href="style.css"></head>
<body><header><p>MULUNGUSHI UNIVERSITY · ICT 251</p><h1>Student Timetable &amp; Goals</h1><span id="connection">Connecting to API…</span></header>
<main><section class="panel"><h2 id="form-title">Add a timetable entry</h2><div id="notice" role="status"></div><form id="entry-form"><input type="hidden" id="entry-id">
<label>Course code<input id="course_code" required placeholder="e.g. ICT251"></label><label>Course name<input id="course_name" required></label>
<div class="grid"><label>Day<select id="day_of_week" required><option value="">Choose day</option><option>Monday</option><option>Tuesday</option><option>Wednesday</option><option>Thursday</option><option>Friday</option><option>Saturday</option><option>Sunday</option></select></label>
<label>Status<select id="status"><option>Planned</option><option>In Progress</option><option>Completed</option></select></label></div>
<div class="grid"><label>Start time<input id="start_time" type="time" required></label><label>End time<input id="end_time" type="time" required></label></div>
<label>Location<input id="location" required></label><label>Study goal<textarea id="study_goal" required rows="3"></textarea></label><button id="save-button">Save entry</button><button id="cancel-button" type="button" class="secondary hidden">Cancel edit</button></form></section>
<section class="panel wide"><div class="top"><h2>Timetable entries</h2><button id="refresh-button" class="secondary" type="button">Refresh</button></div><p><strong id="record-count">0</strong> entries loaded from the API</p><div class="scroll"><table><thead><tr><th>Course</th><th>Schedule</th><th>Study goal</th><th>Status</th><th>Actions</th></tr></thead><tbody id="entries-body"><tr><td colspan="5">Loading…</td></tr></tbody></table></div></section></main><footer>ICT 251 Activity 4 · Question 3</footer><script src="app.js"></script></body></html>
